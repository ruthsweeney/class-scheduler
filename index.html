}

// ─── Admin Panel ──────────────────────────────────────────────────
const DEFAULT_FC = {
  showEventPopup:true,
  showDuplicateClass:true,
};
const DEFAULT_DEF_FC = {
  defDesc:true, defImage:true, defClassType:true, defCategory:true,
  defFacility:true, defTrainer:true, defSize:true, defLevel:true,
  defAdvanced:false,
  defPriceType:true, defClassPass:true, defGymPass:true,
  defSpotBook:true, defSchedules:true,
};
const ADMIN_DEFS = [
  { section:'Calendar', sub:'Calendar event interactions', fields:[
    {k:'showEventPopup',     n:'Event popup',       d:'Click/hover on calendar events for a details card'},
    {k:'showDuplicateClass', n:'Duplicate class',   d:'Allow duplicating a class from the popup'},
  ]},
];
const DEF_ADMIN_DEFS = [
  { section:'Details', sub:'Core class information', fields:[
    {k:'defDesc',      n:'Description',  d:'Class description textarea'},
    {k:'defImage',     n:'Image',        d:'Image upload zone'},
    {k:'defClassType', n:'Class type',   d:'Onsite / Online toggle'},
    {k:'defCategory',  n:'Categories',   d:'Category dropdown'},
  ]},
  { section:'Settings', sub:'Class configuration', fields:[
    {k:'defFacility',  n:'Facility',     d:'Facility selection (required)'},
    {k:'defTrainer',   n:'Trainer',      d:'Trainer assignment'},
    {k:'defSize',      n:'Class size',   d:'Maximum class capacity'},
    {k:'defLevel',     n:'Level',        d:'Difficulty level dropdown'},
  ]},
  { section:'Advanced Settings', sub:'Hidden by default', fields:[
    {k:'defAdvanced', n:'Show Advanced Settings', d:'Start date, end date, notifications & private'},
  ]},
  { section:'Pricing', sub:'Pricing options', fields:[
    {k:'defPriceType', n:'Price / Eligibility', d:'Price type selector'},
    {k:'defClassPass', n:'ClassPass bookings',  d:'ClassPass enabled / disabled'},
    {k:'defGymPass',   n:'Gympass bookings',    d:'Gympass enabled / disabled'},
  ]},
  { section:'Booking', sub:'Booking settings', fields:[
    {k:'defSpotBook', n:'Spot booking (Beta)', d:'Spot booking toggle'},
  ]},
  { section:'Schedules', sub:'Linked schedules view', fields:[
    {k:'defSchedules', n:'Schedules section', d:'Read-only list of linked schedules'},
  ]},
];

function AdminPanel({ fc, onFc, defFc, onDefFc, onClose }) {
  const [tab, setTab] = useState('class');
  const isClass = tab==='class';
  const defs = isClass ? ADMIN_DEFS : DEF_ADMIN_DEFS;
  const curFc = isClass ? fc : defFc;
  const curTog = isClass
    ? k => onFc({...fc,[k]:!fc[k]})
    : k => onDefFc({...defFc,[k]:!defFc[k]});

  return (
    <div className="admin-panel">
      <div className="admin-panel-hdr">
        <div>
          <div className="admin-panel-title">Field Settings</div>
          <div style={{fontSize:12,color:'var(--kit-light)',marginTop:1}}>{isClass?'Create Class drawer':'Class Template drawer'}</div>
        </div>
        <button className="admin-close" onClick={onClose}>{I.close}</button>
      </div>
      <div className="admin-tabs">
        <button className={`admin-tab ${tab==='class'?'active':''}`} onClick={()=>setTab('class')}>Create Class</button>
        <button className={`admin-tab ${tab==='definition'?'active':''}`} onClick={()=>setTab('definition')}>Class Template</button>
      </div>
      <div className="admin-panel-body">
        <div className="admin-notice">
          {I.info}
          <span>{isClass?'Controls the Create Class scheduling drawer.':'Controls the Class Template creation drawer.'}</span>
        </div>
        {defs.map(sec=>(
          <div key={sec.section} className="admin-sec">
            <div className="admin-sec-title">{sec.section}</div>
            {sec.sub && <div style={{fontSize:11,color:'var(--kit-lighter)',marginBottom:6}}>{sec.sub}</div>}
            <div className="admin-sec-card">
              {sec.fields.map(f=>(
                <div key={f.k} className="admin-field-row">
                  <div>
                    <div className="admin-f-name">{f.n}</div>
                    <div className="admin-f-desc">{f.d}</div>
                  </div>
                  <Toggle checked={!!curFc[f.k]} onChange={()=>curTog(f.k)}/>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Toast ────────────────────────────────────────────────────────
function Toast({ msg, onDone }) {
  useEffect(()=>{ const t=setTimeout(onDone,3000); return()=>clearTimeout(t); },[onDone]);
  return <div className="toast">{I.check} {msg}</div>;
}

// ─── App ──────────────────────────────────────────────────────────
function App() {
  const [appView,       setAppView]       = useState('calendar');
  const [manageSubView, setManageSubView] = useState('Classes');
  const [calView,       setCalView]       = useState('Week');
  const [drawer,        setDrawer]        = useState(null);    // { mode, event } | null
  const [defDrawer,     setDefDrawer]     = useState(false);
  const [defDrawerData, setDefDrawerData] = useState(null);
  const [templateData,  setTemplateData]  = useState(()=>({...CLASS_TEMPLATES}));
  const [createMenu,    setCreateMenu]    = useState(false);
  const [adminOpen,     setAdmin]         = useState(false);
  const [fc,            setFc]            = useState(DEFAULT_FC);
  const [defFc,         setDefFc]         = useState(DEFAULT_DEF_FC);
  const [toast,         setToast]         = useState(null);
  const [eventPopup,    setEventPopup]    = useState(null);
  const [dupModal,      setDupModal]      = useState(null);
  const [bookingEvent,  setBookingEvent]  = useState(null);

  const showToast  = msg => setToast(msg);
  const openCreate = ()  => { setDrawer({mode:'create',event:null}); setCreateMenu(false); };

  const handleGoToCalendar = sched => {
    const className = defDrawerData?.name;
    setDefDrawer(false);
    setDefDrawerData(null);
    setAppView('calendar');
    if (sched && className) {
      const ev = EVENTS.find(e => e.t === className && e.recurring);
      if (ev) {
        setDrawer({mode:'editRecurring', event:ev});
      } else {
        showToast(`Opening Calendar for "${className}" schedule…`);
      }
    } else {
      showToast(className ? `Add a schedule for "${className}" from the calendar` : 'Opening Calendar to add schedule…');
    }
  };

  return (
    <div className="app" onClick={e=>{ if(createMenu&&!e.target.closest('.create-wrap'))setCreateMenu(false); }}>

      {/* ── Sidebar ── */}
      <div className="sidebar">
        <div className="sidebar-logo">G</div>
        <div className="sbi" title="Dashboard">{I.dash}</div>
        <div className={`sbi ${appView==='calendar'?'active':''}`} title="Calendar" onClick={()=>setAppView('calendar')}>{I.calNav}</div>
        <div className={`sbi ${appView==='manage'?'active':''}`} title="Manage" onClick={()=>setAppView('manage')}><span className="material-symbols-outlined">build</span></div>
        <div className="sbi" title="Members">{I.person}</div>
        <div className="sbi" title="Reports">{I.graph}</div>
        <div className="sbi" title="Store">{I.tasks}</div>
        <div className="sbi-spacer"/>
        <div className={`sbi ${adminOpen?'active':''}`} title="Field Settings" onClick={()=>setAdmin(v=>!v)}>{I.settings}</div>
      </div>

      {/* ── Main ── */}
      <div className="main">
        <div className="top-hdr">
          <span className="page-title">{appView==='calendar'?'Calendar':'Manage'}</span>
          <div className="hdr-right">
            <div className="search-box">{I.search}<input placeholder="Search Glofox"/></div>
            <button style={{color:'var(--kit-light)',width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center'}}>{I.menu}</button>
          </div>
        </div>

        {appView === 'calendar' ? (
          <div className="cal-body">
            <div className="left-panel">
              <MiniCalendar/>
              <div className="filters">
                <div className="filters-hdr">Filters<button className="reset-btn">{I.reset} Reset</button></div>
                {[{lbl:'Trainers',cnt:47},{lbl:'Classes',cnt:276},{lbl:'Appointments',cnt:18,b:true},{lbl:'Facilities',cnt:27,b:true},{lbl:'Courses',cnt:43}].map(f=>(
                  <div key={f.lbl} className="filter-row">
                    <span className="filter-lbl">{f.lbl}</span>
                    <span className="filter-right"><span className="f-badge">{f.cnt}</span>{f.b&&<span style={{fontSize:10,color:'var(--kit-lighter)'}}>Booked</span>}{I.chevD}</span>
                  </div>
                ))}
              </div>
            </div>
            <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              <div className="cal-toolbar">
                <div className="view-tabs">
                  {['Day','Week','Month'].map(v=>(
                    <button key={v} className={`vtab ${calView===v?'active':''}`} onClick={()=>setCalView(v)}>{v}</button>
                  ))}
                </div>
                <div className="cal-nav">
                  <button className="cal-nav-btn">{I.chevL}</button>
                  <button className="cal-nav-btn">{I.chevR}</button>
                </div>
                <button className="today-btn">Today</button>
                <span className="date-range-lbl">January 18 — 24, 2026</span>
                <div className="toolbar-right">
                  <button className="avail-btn">{I.clock} Appointment availability</button>
                  <div className="create-wrap">
                    <button className="create-btn" onClick={e=>{e.stopPropagation();setCreateMenu(v=>!v);}}>
                      {I.plus} Create {I.chevD}
                    </button>
                    {createMenu && <ContextMenu onSelect={t=>{if(t==='Class')openCreate();setCreateMenu(false);}}/>}
                  </div>
                </div>
              </div>
              <WeekView onSlotClick={openCreate} fc={fc} onEventClick={p=>setEventPopup(p)} templates={templateData}/>
            </div>
          </div>
        ) : (
          <ManageLayout
            subView={manageSubView}
            onSubView={setManageSubView}
            onCreateClass={()=>{ setDefDrawerData(null); setDefDrawer(true); }}
            onToast={showToast}
            onSelectClass={cls=>{ setDefDrawerData(cls); setDefDrawer(true); }}
          />
        )}
      </div>

      {/* ── Class Drawer (create + edit) ── */}
      {drawer && (
        <ClassDrawer
          open={true}
          onClose={()=>setDrawer(null)}
          onSave={(name,action)=>{
            if(action==='delete') showToast(`"${name}" deleted`);
            else showToast(drawer.mode==='create' ? `"${name}" scheduled` : `"${name}" updated successfully`);
          }}
          mode={drawer.mode}
          event={drawer.event}
          templates={templateData}
        />
      )}

      {/* ── Class Definition / Template Drawer ── */}
      <ClassDefinitionDrawer
        key={defDrawerData?.name || 'new'}
        open={defDrawer}
        onClose={()=>{ setDefDrawer(false); setDefDrawerData(null); }}
        onSave={(name, formData)=>{
          if (formData) setTemplateData(prev=>({...prev, [name]:{...(prev[name]||{}), ...formData}}));
          showToast(defDrawerData ? `"${name}" class template updated` : `"${name}" class template created`);
        }}
        defFc={defFc}
        onGoToCalendar={handleGoToCalendar}
        classData={defDrawerData}
      />

      {/* ── Event popup ── */}
      {eventPopup && (
        <EventPopup
          popup={eventPopup}
          onClose={()=>setEventPopup(null)}
          onViewClass={ev=>{ setBookingEvent(ev); setEventPopup(null); }}
          onEditClass={ev=>{ setDrawer({mode:'editSingle',event:ev}); setEventPopup(null); }}
          onEditRecurring={ev=>{ setDrawer({mode:'editRecurring',event:ev}); setEventPopup(null); }}
          onDuplicate={ev=>{ setDupModal(ev); setEventPopup(null); }}
          fc={fc}
          templates={templateData}
        />
      )}

      {/* ── Duplicate modal ── */}
      {dupModal && (
        <DuplicateModal
          event={dupModal}
          onClose={()=>setDupModal(null)}
          onDone={dates=>showToast(`Duplicated "${dupModal.t}" to ${dates.length} date${dates.length!==1?'s':''}`)}
        />
      )}

      {/* ── Class booking list (full screen) ── */}
      {bookingEvent && (
        <ClassBookingList
          event={bookingEvent}
          onClose={()=>setBookingEvent(null)}
        />
      )}

      {/* ── Admin panel ── */}
      {adminOpen && (
        <AdminPanel
          fc={fc}     onFc={setFc}
          defFc={defFc} onDefFc={setDefFc}
          onClose={()=>setAdmin(false)}
        />
      )}

      {/* ── Toast ── */}
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
