<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Scheduler MVP – Glofox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=build" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:'Mulish',-apple-system,sans-serif;background:#FAFAFC;color:#323946;font-size:16px;line-height:24px}
    button{font-family:'Mulish',-apple-system,sans-serif;cursor:pointer;border:none;background:none}
    input,select,textarea{font-family:'Mulish',-apple-system,sans-serif}
    input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}
    input[type="number"]{-moz-appearance:textfield}

    :root{
      --arctic-primary:#4B46C1; --arctic-light:#6661CA; --arctic-lightest:#EDECF8;
      --fennec-primary:#008545;
      --cape-lighter:#FAFAFC; --cape-light:#F4F4F7; --cape-primary:#E9E9F0;
      --cape-dark:#D1D1D8; --cape-darker:#BABAC0;
      --kit-primary:#323946; --kit-light:#6F747D; --kit-lighter:#C1C3C7;
      --pale-primary:#FFFFFF;
      --shadow-card:0px 1px 6px rgba(25,28,35,.10),0px 1px 2px rgba(25,28,35,.07),0px 1px 4px rgba(25,28,35,.06);
      --shadow-btn:0px 1px 10px rgba(25,28,35,.10),0px 2px 4px rgba(25,28,35,.07),0px 1px 6px rgba(25,28,35,.06);
      --shadow-panel:-4px 0 32px rgba(25,28,35,.14);
      --r-lg:12px; --r-md:8px; --r-sm:4px;
      --font:'Mulish',-apple-system,sans-serif;
    }
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px}

    /* ── App ── */
    .app{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:52px;background:#1A1D27;display:flex;flex-direction:column;align-items:center;padding:10px 0 16px;gap:2px;flex-shrink:0;z-index:10}
    .sidebar-logo{width:34px;height:34px;background:var(--arctic-primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;margin-bottom:14px}
    .sbi{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);transition:all .15s;cursor:pointer}
    .sbi:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
    .sbi.active{background:var(--arctic-primary);color:#fff}
    .sbi-spacer{flex:1}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

    /* ── Top header ── */
    .top-hdr{background:var(--pale-primary);border-bottom:1px solid var(--cape-primary);padding:0 18px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .page-title{font-size:20px;font-weight:700}
    .hdr-right{display:flex;align-items:center;gap:8px}
    .search-box{display:flex;align-items:center;gap:6px;background:var(--cape-lighter);border:1px solid var(--cape-primary);border-radius:var(--r-md);padding:5px 10px;width:170px}
    .search-box input{border:none;background:none;outline:none;font-size:14px;color:var(--kit-light);width:100%}

    /* ── Calendar layout ── */
    .cal-body{flex:1;display:flex;overflow:hidden}
    .left-panel{width:220px;border-right:1px solid var(--cape-primary);background:var(--pale-primary);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
    .mini-cal{padding:14px;border-bottom:1px solid var(--cape-primary)}
    .mini-cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .mini-cal-title{font-size:13px;font-weight:700}
    .mini-nav{display:flex;gap:2px}
    .mini-nav-btn{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--kit-light);transition:background .12s}
    .mini-nav-btn:hover{background:var(--cape-lighter)}
    .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
    .mini-dl{font-size:10px;color:var(--kit-light);padding:2px 0;font-weight:700}
    .mini-d{font-size:11px;padding:3px 1px;border-radius:50%;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:background .1s}
    .mini-d:hover:not(.today){background:var(--arctic-lightest);color:var(--arctic-primary)}
    .mini-d.today{background:var(--arctic-primary);color:#fff;font-weight:700}
    .mini-d.om{color:var(--kit-lighter)}
    .filters{padding:12px 14px}
    .filters-hdr{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
    .reset-btn{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--arctic-primary);font-weight:700;font-family:var(--font)}
    .filter-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--cape-primary);cursor:pointer}
    .filter-row:last-of-type{border-bottom:none}
    .filter-lbl{font-size:13px}
    .filter-right{display:flex;align-items:center;gap:4px}
    .f-badge{background:var(--arctic-lightest);color:var(--arctic-primary);font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px}

    /* ── Cal toolbar ── */
    .cal-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--cape-primary);background:var(--pale-primary);flex-shrink:0}
    .view-tabs{display:flex;gap:2px;background:var(--cape-light);padding:3px;border-radius:var(--r-md)}
    .vtab{padding:4px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:700;color:var(--kit-light);transition:all .12s;font-family:var(--font)}
    .vtab.active{background:var(--pale-primary);color:var(--kit-primary);box-shadow:var(--shadow-card)}
    .cal-nav{display:flex;gap:2px}
    .cal-nav-btn{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--kit-light);transition:background .12s}
    .cal-nav-btn:hover{background:var(--cape-light)}
    .today-btn{padding:5px 12px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:13px;font-weight:700;color:var(--kit-primary);font-family:var(--font);transition:all .12s}
    .today-btn:hover{border-color:var(--arctic-primary);color:var(--arctic-primary)}
    .date-range-lbl{font-size:14px;font-weight:700;color:var(--kit-light);flex:1}
    .toolbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .avail-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:14px;font-weight:700;color:var(--kit-light);font-family:var(--font)}
    .create-wrap{position:relative}
    .create-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--arctic-primary);color:#fff;border-radius:var(--r-md);font-size:14px;font-weight:700;font-family:var(--font);box-shadow:var(--shadow-btn)}
    .create-btn:hover{background:var(--arctic-light)}

    /* ── Context / Slot menus ── */
    .ctx-menu{position:absolute;top:calc(100%+4px);right:0;background:var(--pale-primary);border:1px solid var(--cape-primary);border-radius:var(--r-lg);padding:6px;min-width:160px;box-shadow:var(--shadow-panel);z-index:30}
    .ctx-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-md);font-size:14px;color:var(--kit-primary);width:100%;text-align:left;transition:background .1s}
    .ctx-item:hover{background:var(--cape-light)}
    .ctx-divider{margin:4px 0;border:none;border-top:1px solid var(--cape-primary)}
    .slot-menu{position:absolute;background:var(--pale-primary);border:1px solid var(--cape-primary);border-radius:var(--r-lg);padding:6px;min-width:162px;box-shadow:var(--shadow-panel);z-index:30}
    .slot-menu-hdr{font-size:11px;font-weight:700;color:var(--kit-lighter);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px 4px}

    /* ── Week view ── */
    .week-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
    .week-col-hdrs{display:grid;grid-template-columns:48px repeat(7,1fr);border-bottom:1px solid var(--cape-primary);background:var(--pale-primary);flex-shrink:0}
    .week-col-spacer{border-right:1px solid var(--cape-primary)}
    .week-col-hdr{border-right:1px solid var(--cape-primary);padding:8px 0 6px;text-align:center}
    .week-day-name{font-size:11px;font-weight:700;color:var(--kit-lighter);text-transform:uppercase;letter-spacing:.5px}
    .week-day-num{font-size:16px;font-weight:700;color:var(--kit-light);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
    .week-day-num.today{background:var(--arctic-primary);color:#fff}
    .week-scroll{flex:1;overflow-y:auto}
    .week-grid{display:grid;grid-template-columns:48px repeat(7,1fr)}
    .time-lbl{font-size:11px;color:var(--kit-lighter);padding:6px 4px 0;text-align:right;border-right:1px solid var(--cape-primary);position:relative;top:-8px;font-weight:600}
    .day-cell{border-right:1px solid var(--cape-primary);border-bottom:1px solid var(--cape-primary);min-height:54px;padding:3px;cursor:pointer;transition:background .1s;position:relative}
    .day-cell:hover:not(.filled){background:var(--arctic-lightest)}
    .ev{border-radius:var(--r-sm);padding:4px 7px;margin-bottom:2px;cursor:pointer;transition:opacity .1s}
    .ev:hover{opacity:.88}
    .ev-title{font-size:12px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ev-time{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px}
    .ev-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
    .ev-inst{font-size:10px;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .ev-sub{font-size:9px;font-weight:700;background:rgba(255,255,255,.28);border-radius:3px;padding:0 4px;margin-left:4px;line-height:14px;display:inline-block}
    .ev-recurr-ico{display:flex;align-items:center;opacity:.8;flex-shrink:0}

    /* ── Drawer ── */
    .drawer-scrim{position:fixed;inset:0;background:rgba(25,28,35,.3);z-index:20}
    .drawer{position:fixed;right:0;top:0;bottom:0;width:880px;max-width:100vw;background:var(--pale-primary);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow-panel);overflow:hidden}
    .drawer-hdr{padding:16px 20px;border-bottom:1px solid var(--cape-primary);display:flex;align-items:center;gap:14px;background:var(--pale-primary);flex-shrink:0}
    .dr-fab{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--kit-light);transition:background .12s}
    .dr-fab:hover{background:var(--cape-light)}
    .dr-title-wrap{flex:1;min-width:0}
    .dr-label{font-size:12px;font-weight:700;color:var(--kit-light);text-transform:uppercase;letter-spacing:.4px;display:block}
    .dr-classname{font-size:20px;font-weight:700;color:var(--kit-primary);display:block;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .btn-cancel{padding:7px 16px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:14px;font-weight:700;color:var(--kit-primary);font-family:var(--font);background:var(--pale-primary);transition:all .15s}
    .btn-cancel:hover{border-color:var(--kit-light)}
    .btn-save{padding:7px 16px;background:var(--arctic-primary);color:#fff;border-radius:var(--r-md);font-size:14px;font-weight:700;font-family:var(--font);box-shadow:var(--shadow-btn);transition:all .15s}
    .btn-save:hover{background:var(--arctic-light)}
    .btn-save:disabled{background:var(--cape-dark);box-shadow:none;cursor:not-allowed}
    .btn-delete{padding:7px 14px;font-size:14px;font-weight:700;background:#FBE9EB;color:#DE233C;border:1.5px solid #E24459;border-radius:var(--r-md);font-family:var(--font);transition:all .15s}
    .btn-delete:hover{background:#DE233C;color:#fff}
    .drawer-content{flex:1;overflow-y:auto;padding:20px;background:var(--cape-lighter)}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;font-size:20px;line-height:1;user-select:none}
    .card{background:var(--pale-primary);border:1px solid var(--cape-primary);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card)}
    .card:last-child{margin-bottom:0}
    .card-title{font-size:16px;font-weight:700;margin-bottom:16px}
    .f-group{margin-bottom:14px}
    .f-group:last-child{margin-bottom:0}
    .f-label{display:block;font-size:13px;font-weight:700;color:var(--kit-primary);margin-bottom:6px}
    .req{color:#DE233C;margin-left:2px}
    .f-input{width:100%;padding:9px 12px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:14px;color:var(--kit-primary);outline:none;background:var(--pale-primary);font-family:var(--font);transition:border-color .12s}
    .f-input:focus{border-color:var(--arctic-primary)}
    .f-input:disabled{background:var(--cape-lighter);color:var(--kit-light);cursor:not-allowed}
    .f-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:14px;color:var(--kit-primary);outline:none;resize:vertical;background:var(--pale-primary);font-family:var(--font)}
    .f-textarea:focus{border-color:var(--arctic-primary)}
    .f-select{width:100%;padding:9px 12px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:14px;color:var(--kit-primary);outline:none;appearance:none;background:var(--pale-primary);font-family:var(--font);cursor:pointer}
    .f-select:focus{border-color:var(--arctic-primary)}
    .f-select:disabled{background:var(--cape-lighter);color:var(--kit-light);cursor:not-allowed}
    .sel-wrap{position:relative}
    .chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--kit-light)}
    .date-rel{position:relative}
    .date-ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--kit-light)}

    /* ── Schedule type tabs ── */
    .sched-tabs{display:flex;background:var(--cape-light);border-radius:var(--r-md);padding:3px;gap:2px;margin-bottom:16px}
    .sched-tab{flex:1;padding:7px 8px;font-size:13px;font-weight:700;border-radius:6px;color:var(--kit-light);transition:all .15s;font-family:var(--font);text-align:center}
    .sched-tab.active{background:var(--arctic-primary);color:#fff;box-shadow:var(--shadow-btn)}

    /* ── Trainer row with inline substitute ── */
    .trainer-row{display:flex;align-items:center;gap:10px}
    .trainer-row .sel-wrap{flex:1;min-width:0}
    .sub-inline{display:flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;white-space:nowrap}
    .sub-chk-box{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--cape-dark);display:flex;align-items:center;justify-content:center;background:var(--pale-primary);transition:all .12s;flex-shrink:0}
    .sub-chk-box.on{background:var(--arctic-primary);border-color:var(--arctic-primary)}
    .sub-chk-lbl{font-size:13px;font-weight:600;color:var(--kit-primary)}

    /* ── Date-end row ── */
    .date-end-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .date-end-row .date-rel{flex:1;min-width:110px}
    .date-sep{font-size:13px;color:var(--kit-light);flex-shrink:0}
    .no-end-row{display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;white-space:nowrap}
    .date-row-wrap{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
    .date-col{display:flex;flex-direction:column;gap:4px}
    .date-sep-mid{font-size:13px;color:var(--kit-light);padding-bottom:9px;flex-shrink:0}

    /* ── Multi-select ── */
    .msel-wrap{position:relative}
    .msel-input{display:flex;align-items:center;min-height:36px;background:var(--pale-primary);border:1.5px solid var(--cape-dark);border-radius:var(--r-lg);padding:5px 10px;cursor:pointer;gap:6px;flex-wrap:wrap}
    .msel-input:hover{border-color:var(--cape-darker)}
    .msel-placeholder{color:var(--kit-lighter);font-size:15px;flex:1}
    .msel-chips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
    .msel-chip{display:flex;align-items:center;gap:3px;background:var(--arctic-lightest);color:var(--arctic-primary);font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border-radius:20px}
    .msel-chip-rm{display:flex;align-items:center;justify-content:center;color:var(--arctic-primary);opacity:.6;padding:0 0 0 2px}
    .msel-chip-rm:hover{opacity:1}
    .msel-chev{flex-shrink:0;color:var(--kit-lighter)}
    .msel-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--pale-primary);border:1.5px solid var(--cape-dark);border-radius:var(--r-lg);box-shadow:var(--shadow-card);z-index:200;max-height:200px;overflow-y:auto}
    .msel-opt{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px;cursor:pointer}
    .msel-opt:hover{background:var(--cape-lighter)}
    .msel-opt.on{color:var(--arctic-primary)}
    .msel-chk{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--cape-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--pale-primary)}
    .msel-opt.on .msel-chk{background:var(--arctic-primary);border-color:var(--arctic-primary)}

    /* ── Frequency locked ── */
    .freq-locked{display:flex;align-items:center;justify-content:space-between;background:var(--cape-lighter);border:1.5px solid var(--cape-primary);border-radius:var(--r-md);padding:9px 12px;font-size:14px;color:var(--kit-light);cursor:not-allowed}

    /* ── Every row ── */
    .every-row{display:flex;align-items:center;gap:8px}
    .every-num{width:64px;padding:9px 12px;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);font-size:14px;color:var(--kit-primary);outline:none;font-family:var(--font);text-align:center;background:var(--pale-primary)}
    .every-num:focus{border-color:var(--arctic-primary)}
    .every-row .sel-wrap{width:130px}

    /* ── Day selector ── */
    .day-sel{display:flex;gap:4px;flex-wrap:wrap}
    .day-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--cape-dark);font-size:12px;font-weight:700;color:var(--kit-light);transition:all .15s;font-family:var(--font)}
    .day-btn.on{background:var(--arctic-primary);border-color:var(--arctic-primary);color:#fff}

    /* ── Day slot groups (Week mode) ── */
    .day-slot-sec{display:flex;flex-direction:column;gap:10px;margin-top:10px}
    .dsg{display:flex;gap:10px;align-items:flex-start}
    .dsg-lbl{width:90px;font-size:13px;font-weight:700;color:var(--kit-light);padding-top:9px;flex-shrink:0}
    .dsg-times{flex:1;display:flex;flex-direction:column;gap:6px}
    .dsg-acts{display:flex;gap:4px;flex-shrink:0;padding-top:4px}
    .dsa-btn{width:26px;height:26px;border-radius:var(--r-sm);border:1.5px solid var(--cape-dark);display:flex;align-items:center;justify-content:center;color:var(--kit-light);background:var(--pale-primary);transition:all .12s}
    .dsa-btn:hover{border-color:var(--arctic-primary);color:var(--arctic-primary)}
    .no-days-hint{padding:14px;background:var(--cape-lighter);border-radius:var(--r-md);text-align:center;font-size:13px;color:var(--kit-lighter)}

    /* ── Time input row ── */
    .t-row{display:flex;align-items:center;gap:6px}
    .t-in{border:1.5px solid var(--cape-dark);border-radius:var(--r-md);padding:7px 8px;font-size:13px;font-family:var(--font);color:var(--kit-primary);outline:none;width:84px;background:var(--pale-primary)}
    .t-in:focus{border-color:var(--arctic-primary)}
    .t-arr{color:var(--kit-lighter);font-size:14px;flex-shrink:0}
    .t-ico{color:var(--kit-lighter);flex-shrink:0;display:flex;align-items:center}
    .t-rm{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--kit-lighter);flex-shrink:0}
    .t-rm:hover{background:var(--cape-light);color:#DE233C}

    /* ── Day(s) mode flat times ── */
    .class-times-sec{margin-top:4px}
    .class-times-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .class-times-lbl{font-size:13px;font-weight:700;color:var(--kit-primary)}
    .add-time-btn{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--arctic-primary);padding:2px 0;font-family:var(--font)}

    /* ── Date specific ── */
    .ds-sched-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .ds-sched-title{font-size:16px;font-weight:700}
    .ds-add-btn{display:flex;align-items:center;gap:5px;padding:6px 14px;border:1.5px solid var(--arctic-primary);border-radius:var(--r-md);color:var(--arctic-primary);font-size:13px;font-weight:700;font-family:var(--font);transition:all .12s}
    .ds-add-btn:hover{background:var(--arctic-lightest)}
    .ds-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--cape-primary)}
    .ds-row:last-child{border-bottom:none}
    .ds-date-lbl{font-size:13px;font-weight:700;color:var(--kit-primary);width:90px;flex-shrink:0;padding-top:9px}
    .ds-times{flex:1;display:flex;flex-direction:column;gap:6px}
    .ds-row-add{width:26px;height:26px;border-radius:var(--r-sm);border:1.5px solid var(--cape-dark);display:flex;align-items:center;justify-content:center;color:var(--kit-light);flex-shrink:0;margin-top:4px}
    .ds-row-add:hover{border-color:var(--arctic-primary);color:var(--arctic-primary)}
    .ds-no-dates{padding:20px;text-align:center;color:var(--kit-lighter);font-size:14px}

    /* ── Date picker calendar ── */
    .dpc-wrap{background:var(--pale-primary);border:1px solid var(--cape-primary);border-radius:var(--r-lg);padding:12px;margin-bottom:12px;box-shadow:var(--shadow-card)}
    .dpc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .dpc-nav-btn{width:26px;height:26px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--kit-light);font-size:16px;font-weight:700;transition:background .1s}
    .dpc-nav-btn:hover{background:var(--cape-light)}
    .dpc-month-lbl{font-size:14px;font-weight:700}
    .dpc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
    .dpc-dh{font-size:10px;font-weight:700;color:var(--kit-lighter);padding:4px 0}
    .dpc-day{font-size:12px;padding:4px;border-radius:50%;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:all .1s}
    .dpc-day.om{color:var(--kit-lighter);pointer-events:none}
    .dpc-day:hover:not(.om):not(.sel){background:var(--arctic-lightest);color:var(--arctic-primary)}
    .dpc-day.today-d:not(.sel){background:var(--cape-light);font-weight:700}
    .dpc-day.sel{background:var(--arctic-primary);color:#fff;font-weight:700}
    .dpc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--cape-primary)}
    .dpc-done-btn{font-size:13px;font-weight:700;color:#fff;background:var(--arctic-primary);padding:5px 14px;border-radius:var(--r-sm);font-family:var(--font)}

    /* ── Date Picker Popover (Figma 31-20980) ── */
    .dp-field{display:flex;align-items:center;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);padding:9px 12px;cursor:pointer;background:var(--pale-primary);gap:8px;transition:border-color .12s;width:100%}
    .dp-field:hover,.dp-field.dp-open{border-color:var(--arctic-primary)}
    .dp-field.dp-disabled{opacity:.5;pointer-events:none}
    .dp-field-text{flex:1;font-size:14px;color:var(--kit-primary)}
    .dp-field-text.dp-ph{color:var(--kit-lighter)}
    .dp-popover{background:var(--pale-primary);border-radius:14px;box-shadow:0 8px 24px rgba(25,28,35,.14),0 3px 8px rgba(25,28,35,.08);padding:16px;width:300px}
    .dp-popover-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .dp-nav-group{display:flex;gap:2px}
    .dp-nav-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--kit-light);font-size:15px;font-weight:700;transition:background .12s;font-family:var(--font);line-height:1}
    .dp-nav-btn:hover{background:var(--cape-light)}
    .dp-month-yr{font-size:15px;font-weight:700;color:var(--arctic-primary)}
    .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
    .dp-dow{font-size:11px;font-weight:700;color:var(--kit-lighter);padding:6px 0;text-align:center}
    .dp-day-cell{display:flex;align-items:center;justify-content:center;padding:2px 0}
    .dp-day{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;transition:all .1s;margin:0 auto}
    .dp-day:hover:not(.dp-sel):not(.dp-om){background:var(--arctic-lightest);color:var(--arctic-primary)}
    .dp-day.dp-sel{background:var(--arctic-primary);color:#fff}
    .dp-day.dp-today:not(.dp-sel){border:1.5px solid var(--arctic-primary);color:var(--arctic-primary)}
    .dp-day.dp-om{color:var(--kit-lighter);cursor:default;pointer-events:none}
    .dp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--cape-primary)}
    .dp-today-btn{font-size:14px;font-weight:700;color:var(--arctic-primary);font-family:var(--font)}
    .dp-today-btn:hover{text-decoration:underline}
    .dp-done-btn{padding:8px 20px;background:var(--fennec-primary);color:#fff;border-radius:var(--r-md);font-size:14px;font-weight:700;font-family:var(--font)}
    /* ── Time Picker Popover (Figma 85-13249) ── */
    .tp-wrap{position:relative;display:inline-block}
    .tp-trigger{display:flex;align-items:center;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);padding:8px 10px;cursor:pointer;background:var(--pale-primary);min-width:80px;transition:border-color .12s;justify-content:center}
    .tp-trigger:hover,.tp-trigger.tp-open{border-color:var(--arctic-primary)}
    .tp-val{font-size:13px;font-weight:600;color:var(--kit-primary)}
    .tp-val.tp-ph{color:var(--kit-lighter);font-weight:400;font-size:12px}
    .tp-popover{background:var(--pale-primary);border-radius:12px;box-shadow:0 5px 20px rgba(25,28,35,.14),0 3px 10px rgba(25,28,35,.08);overflow:hidden;width:128px}
    .tp-cols{display:flex}
    .tp-col{flex:1;overflow-y:auto;max-height:256px}
    .tp-col::-webkit-scrollbar{display:none}
    .tp-cell{height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--kit-primary);cursor:pointer;transition:background .1s;font-family:var(--font)}
    .tp-cell:hover:not(.tp-sel){background:var(--cape-light)}
    .tp-cell.tp-sel{background:var(--arctic-primary);color:#fff}
    .tp-divider{width:1px;background:var(--cape-primary);flex-shrink:0}

    /* ── Confirm / overlay modal ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(25,28,35,.5);z-index:60;display:flex;align-items:center;justify-content:center}
    .modal-box{background:var(--pale-primary);border-radius:var(--r-lg);box-shadow:0 10px 40px rgba(25,28,35,.2);width:480px;max-width:calc(100vw - 32px)}
    .modal-hdr{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-size:18px;font-weight:700}
    .modal-body{padding:16px 24px 4px}
    .modal-desc{font-size:14px;color:var(--kit-light);margin-bottom:14px}
    .modal-sec-title{font-size:13px;font-weight:700;color:var(--kit-primary);margin-bottom:8px}
    .changes-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .change-item{display:flex;gap:8px;font-size:14px;color:var(--kit-primary)}
    .change-bullet{color:var(--arctic-primary);font-weight:700;flex-shrink:0}
    .apply-opts{display:flex;flex-direction:column;gap:8px}
    .modal-footer{padding:16px 24px;border-top:1px solid var(--cape-primary);display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:16px}
    .btn-confirm{padding:8px 18px;background:var(--arctic-primary);color:#fff;border-radius:var(--r-md);font-size:14px;font-weight:700;font-family:var(--font);box-shadow:var(--shadow-btn)}
    .btn-confirm:hover{background:var(--arctic-light)}
    .btn-confirm:disabled{background:var(--cape-dark);box-shadow:none;cursor:not-allowed}

    /* ── Event popup (Figma design) ── */
    .ep-card{position:fixed;z-index:50;background:var(--pale-primary);border-radius:16px;box-shadow:0 5px 10px rgba(25,28,35,.10),0 8px 20px rgba(25,28,35,.07),0 3px 28px rgba(25,28,35,.06);width:284px;overflow:hidden}
    .ep-card-hdr{padding:20px 20px 8px}
    .ep-title-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .ep-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
    .ep-class-name{font-size:20px;font-weight:700;color:var(--kit-primary);line-height:28px}
    .ep-time{font-size:16px;color:var(--kit-light);margin-bottom:6px}
    .ep-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:4px 0;margin-bottom:4px}
    .ep-meta-item{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--kit-light)}
    .ep-recurr-tag{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--arctic-primary);font-weight:600}
    .ep-facility{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--kit-light)}
    .ep-capacity{padding:8px 20px 12px}
    .ep-cap-row{display:flex;align-items:center;gap:8px}
    .ep-cap-track{flex:1;height:6px;background:var(--cape-primary);border-radius:3px;overflow:hidden}
    .ep-cap-fill{height:100%;background:var(--arctic-primary);border-radius:3px;transition:width .3s}
    .ep-cap-lbl{font-size:14px;color:var(--kit-light);text-align:right;flex-shrink:0;width:32px}
    .ep-divider{height:1px;background:var(--cape-primary)}
    .ep-actions{padding:12px 16px;display:flex;flex-direction:column;gap:0}
    .ep-action{display:flex;align-items:center;gap:12px;padding:9px 4px;cursor:pointer;border-radius:var(--r-sm);transition:background .1s}
    .ep-action:hover{background:var(--cape-lighter);margin:0 -4px;padding-left:8px;padding-right:8px}
    .ep-action-ico{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--kit-light);flex-shrink:0}
    .ep-action-ico.pri{color:var(--arctic-primary)}
    .ep-action-lbl{font-size:16px;color:var(--kit-primary)}
    .ep-action-lbl.pri{color:var(--arctic-primary)}

    /* ── Class booking list ── */
    .cb-overlay{position:fixed;inset:0;z-index:60;background:var(--pale-primary);display:flex;flex-direction:column;overflow:hidden}
    .cb-hdr{height:56px;border-bottom:1px solid var(--cape-primary);padding:0 20px;display:flex;align-items:center;gap:10px;background:var(--pale-primary);flex-shrink:0}
    .cb-back-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--kit-light);padding:6px 10px;border-radius:var(--r-md);transition:background .12s;font-family:var(--font)}
    .cb-back-btn:hover{background:var(--cape-light);color:var(--kit-primary)}
    .cb-hdr-title{font-size:20px;font-weight:700;color:var(--kit-primary)}
    .cb-id-pill{display:flex;align-items:center;gap:4px;background:var(--cape-light);border:1px solid var(--cape-primary);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:var(--kit-light)}
    .cb-spacer{flex:1}
    .cb-actions-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;font-size:14px;font-weight:700;border:1.5px solid var(--cape-dark);border-radius:var(--r-md);color:var(--kit-primary);font-family:var(--font);background:var(--pale-primary)}
    .cb-book-btn{display:flex;align-items:center;gap:5px;padding:7px 16px;font-size:14px;font-weight:700;background:var(--arctic-primary);color:#fff;border-radius:var(--r-md);font-family:var(--font);box-shadow:var(--shadow-btn)}
    .cb-book-btn:hover{background:var(--arctic-light)}
    .cb-meta{height:36px;background:var(--cape-lighter);border-bottom:1px solid var(--cape-primary);padding:0 20px;display:flex;align-items:center;gap:24px;flex-shrink:0}
    .cb-meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--kit-light)}
    .cb-tabs-row{display:flex;align-items:center;border-bottom:1px solid var(--cape-primary);padding:0 20px;background:var(--pale-primary);flex-shrink:0}
    .cb-tab{padding:13px 16px;font-size:13px;font-weight:700;color:var(--kit-light);border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .12s,border-color .12s;font-family:var(--font);background:none;border-left:none;border-right:none;border-top:none}
    .cb-tab.active{color:var(--arctic-primary);border-bottom-color:var(--arctic-primary)}
    .cb-tab-badge{background:var(--arctic-lightest);color:var(--arctic-primary);font-size:11px;font-weight:700;padding:1px 6px;border-radius:10px;line-height:16px}
    .cb-tab-badge.frac{background:var(--cape-light);color:var(--kit-primary)}
    .cb-cols-btn{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--kit-light);border:1px solid var(--cape-primary);border-radius:var(--r-md);padding:5px 10px;background:var(--pale-primary);font-family:var(--font)}
    .cb-body{flex:1;overflow-y:auto}
    .cb-th-row{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 2fr 1.3fr 44px;border-bottom:1px solid var(--cape-primary);padding:8px 20px;background:var(--cape-lighter)}
    .cb-th{font-size:12px;font-weight:700;color:var(--kit-light);display:flex;align-items:center;gap:3px}
    .cb-data-row{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 2fr 1.3fr 44px;padding:14px 20px;border-bottom:1px solid var(--cape-primary);align-items:center}
    .cb-data-row:hover{background:var(--cape-lighter)}
    .cb-client-cell{display:flex;align-items:center;gap:10px}
    .cb-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
    .cb-client-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
    .cb-extra-badge{background:var(--arctic-lightest);color:var(--arctic-primary);font-size:11px;font-weight:700;padding:1px 5px;border-radius:10px}
    .cb-client-email{font-size:12px;color:var(--kit-light);margin-top:1px}
    .cb-visit-main{font-size:13px;font-weight:600;color:var(--kit-primary)}
    .cb-visit-sub{font-size:12px;color:var(--kit-light);margin-top:1px}
    .cb-tag-chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .cb-tag-chip{display:inline-flex;align-items:center;padding:2px 7px;background:var(--cape-light);border:1px solid var(--cape-primary);border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
    .cb-tag-more{font-size:11px;font-weight:700;color:var(--kit-light);margin-left:2px}
    .cb-status{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:700}
    .cb-status.pending{background:#FBF1EC;color:#DD7B42}
    .cb-status.processed{background:#E5F2EC;color:#008545}
    .cb-status.waived{background:#E5F1F9;color:#0079C4}
    .cb-status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
    .cb-3dot{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--kit-light);font-size:18px;font-weight:700;font-family:var(--font)}
    .cb-3dot:hover{background:var(--cape-light)}
    .cb-empty{padding:60px 20px;text-align:center;color:var(--kit-light);font-size:14px;font-weight:600}

    /* ── Class definition / template ── */
    .tog-track{width:36px;height:20px;border-radius:10px;background:var(--cape-dark);cursor:pointer;transition:background .15s;position:relative;flex-shrink:0}
    .tog-track.on{background:var(--arctic-primary)}
    .tog-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
    .tog-track.on .tog-thumb{transform:translateX(16px)}
    .chk-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
    .chk-box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--cape-dark);display:flex;align-items:center;justify-content:center;background:var(--pale-primary);transition:all .12s;flex-shrink:0}
    .chk-box.on{background:var(--arctic-primary);border-color:var(--arctic-primary)}
    .chk-lbl{font-size:14px;color:var(--kit-primary)}
    .seg-ctrl{display:flex;background:var(--cape-light);border-radius:var(--r-md);padding:3px;gap:2px}
    .seg-opt{flex:1;padding:5px 10px;font-size:13px;font-weight:700;border-radius:6px;color:var(--kit-light);transition:all .12s;font-family:var(--font)}
    .seg-opt.active{background:var(--pale-primary);color:var(--kit-primary);box-shadow:var(--shadow-card)}
    .img-upload-box{border:2px dashed var(--cape-dark);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:border-color .12s;background:var(--cape-lighter)}
    .img-upload-box:hover{border-color:var(--arctic-primary)}
    .img-upload-text{font-size:13px;color:var(--kit-light);text-align:center}
    .color-swatches{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0}
    .color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .color-swatch:hover{transform:scale(1.15)}
    .color-swatch.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
    .sched-read-section{background:var(--cape-lighter);border-radius:var(--r-md);border:1px solid var(--cape-primary);overflow:hidden}
    .sched-read-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--cape-primary)}
    .sched-read-row:last-child{border-bottom:none}
    .sched-read-detail{font-size:12px;color:var(--kit-light);margin-top:2px}
    .edit-in-cal-btn{background:none;border:none;font-size:13px;font-weight:700;color:var(--arctic-primary);font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:4px;padding:0;flex-shrink:0}
    .edit-in-cal-btn:hover{color:var(--arctic-light)}

    /* ── Manage ── */
    .manage-layout{display:flex;flex:1;overflow:hidden}
    .manage-nav{width:200px;border-right:1px solid var(--cape-primary);background:var(--pale-primary);padding:16px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
    .manage-nav-hdr{font-size:11px;font-weight:700;color:var(--kit-lighter);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px 10px}
    .manage-nav-item{padding:7px 10px;font-size:14px;font-weight:600;color:var(--kit-light);border-radius:var(--r-md);text-align:left;transition:all .12s;font-family:var(--font);width:100%}
    .manage-nav-item:hover{background:var(--cape-light);color:var(--kit-primary)}
    .manage-nav-item.active{background:var(--arctic-lightest);color:var(--arctic-primary);font-weight:700}
    .classes-page{flex:1;overflow-y:auto}
    .classes-pg-hdr{padding:16px 20px 14px;border-bottom:1px solid var(--cape-primary);display:flex;align-items:center;gap:10px;background:var(--pale-primary)}
    .classes-pg-title{font-size:18px;font-weight:700}
    .search-cls{display:flex;align-items:center;gap:6px;background:var(--cape-lighter);border:1px solid var(--cape-primary);border-radius:var(--r-md);padding:6px 10px;width:200px}
    .search-cls input{border:none;background:none;outline:none;font-size:13px;width:100%}
    .classes-content{padding:14px 20px}
    .classes-count-bar{display:flex;align-items:center;margin-bottom:12px;gap:8px}
    .classes-count{font-size:14px;font-weight:700;color:var(--kit-light)}

let _id = 0;
const uid    = () => ++_id;
const mkTime = () => ({ id:uid(), start:'', end:'' });

const fmtDate = d => {
  if (!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
};
const toDateKey = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const getDaysGrid = (y,m) => {
  const first = new Date(y,m,1).getDay();
  const total = new Date(y,m+1,0).getDate();
  const cells = [];
  for (let i=0;i<first;i++) cells.push(null);
  for (let d=1;d<=total;d++) cells.push(d);
  while (cells.length%7!==0) cells.push(null);
  return cells;
};

function Checkbox({ checked, onChange, label }) {

function Toggle({ checked, onChange }) {
  return (
    <div className={`tog-track ${checked?'on':''}`} onClick={() => onChange(!checked)}>

}
function Sel({ value, onChange, opts, placeholder, disabled }) {

    <div className="sel-wrap">
      <select className="f-select" value={value} disabled={disabled} onChange={e=>onChange(e.target.value)}>
        {placeholder && <option value="">{placeholder}</option>}
        {opts.map(o => <option key={o}>{o}</option>)}
      </select>
      <span className="chev">{I.chevD}</span>
    </div>

}
// ─── MultiSel — multi-select with chips ──────────────────────────
function MultiSel({ value, onChange, opts, placeholder }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const toggle = opt => onChange(value.includes(opt) ? value.filter(v=>v!==opt) : [...value, opt]);
  return (
    <div className="msel-wrap" ref={ref}>
      <div className="msel-input" onClick={()=>setOpen(v=>!v)}>
        {value.length === 0 ? (
          <span className="msel-placeholder">{placeholder || 'Select...'}</span>
        ) : (
          <div className="msel-chips">
            {value.map(v=>(
              <span key={v} className="msel-chip">
                {v}
                <button className="msel-chip-rm" onClick={e=>{e.stopPropagation();toggle(v);}}>{I.closeXS}</button>
              </span>
            ))}
          </div>
        )}
        <span className="msel-chev">{I.chevD}</span>
      </div>
      {open && (
        <div className="msel-dropdown">
          {opts.map(o=>(
            <div key={o} className={`msel-opt ${value.includes(o)?'on':''}`} onClick={()=>toggle(o)}>
              <div className="msel-chk">{value.includes(o)&&I.check}</div>
              {o}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── CalGrid — shared calendar grid ──────────────────────────────
function CalGrid({ year, month, selected, onToggle }) {
  const now = new Date();
  const cells = getDaysGrid(year, month);
  return (
    <>
      <div className="dp-grid">
        {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>(
          <div key={d} className="dp-dow">{d}</div>
        ))}
        {cells.map((d,i) => {
          if (!d) return <div key={i} className="dp-day-cell"><div className="dp-day dp-om"> </div></div>;
          const key = toDateKey(year, month, d);
          const isSel  = selected.includes(key);
          const isToday = year===now.getFullYear() && month===now.getMonth() && d===now.getDate();
          return (
            <div key={i} className="dp-day-cell">
              <div className={`dp-day ${isSel?'dp-sel':''} ${isToday&&!isSel?'dp-today':''}`} onClick={()=>onToggle(key,isSel)}>
                {d}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// ─── DateIn — single date field + popover ────────────────────────
function DateIn({ value, onChange, disabled }) {
  const [open, setOpen] = useState(false);
  const [pos,  setPos]  = useState({top:0,left:0});
  const [vm,   setVm]   = useState(() => {
    const d = value ? new Date(value+'T00:00:00') : new Date();
    return { y:d.getFullYear(), m:d.getMonth() };
  });
  const trigRef = useRef(null);
  const popRef  = useRef(null);

  useEffect(() => {
    const h = e => {
      if (open && trigRef.current && !trigRef.current.contains(e.target) && popRef.current && !popRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const openPop = () => {
    if (disabled) return;
    if (trigRef.current) {
      const r = trigRef.current.getBoundingClientRect();
      const left = Math.min(r.left, window.innerWidth - 320);
      setPos({ top: r.bottom+4, left: Math.max(8, left) });
    }
    if (value) { const d=new Date(value+'T00:00:00'); setVm({y:d.getFullYear(),m:d.getMonth()}); }
    setOpen(v=>!v);
  };

  const today = new Date();
  const todayKey = toDateKey(today.getFullYear(), today.getMonth(), today.getDate());
  const display  = value ? value.split('-').slice(1).reverse().join('/').replace(/^(\d+)\/(\d+)/,'$1/$2')+'/'+value.split('-')[0] : '';
  // Format: MM/DD/YYYY
  const fmt = value ? (()=>{ const [y,mo,d]=value.split('-'); return `${mo}/${d}/${y}`; })() : '';

  const prevM = () => setVm(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1});
  const nextM = () => setVm(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1});
  const prevY = () => setVm(v=>({...v,y:v.y-1}));
  const nextY = () => setVm(v=>({...v,y:v.y+1}));

  return (
    <div ref={trigRef} style={{width:'100%'}}>
      <div className={`dp-field ${open?'dp-open':''} ${disabled?'dp-disabled':''}`} onClick={openPop}>
        <span className={`dp-field-text ${!value?'dp-ph':''}`}>{fmt||'Select date'}</span>
        <span style={{color:'var(--kit-lighter)',flexShrink:0}}>{I.cal}</span>
      </div>
      {open && ReactDOM.createPortal(
        <div ref={popRef} className="dp-popover" style={{position:'fixed',top:pos.top,left:pos.left,zIndex:9999}}>
          <div className="dp-popover-hdr">
            <div className="dp-nav-group">
              <button className="dp-nav-btn" onClick={prevY}>«</button>
              <button className="dp-nav-btn" onClick={prevM}>‹</button>
            </div>
            <span className="dp-month-yr">{MONTH_NAMES[vm.m]} {vm.y}</span>
            <div className="dp-nav-group">
              <button className="dp-nav-btn" onClick={nextM}>›</button>
              <button className="dp-nav-btn" onClick={nextY}>»</button>
            </div>
          </div>
          <CalGrid year={vm.y} month={vm.m} selected={value?[value]:[]}
            onToggle={key=>{ onChange(key); setOpen(false); }}/>
          <div className="dp-footer">
            <button className="dp-today-btn" onClick={()=>{ onChange(todayKey); setOpen(false); }}>Today</button>
            <button className="dp-done-btn" onClick={()=>setOpen(false)}>Done</button>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

// ─── TimePicker — time field + popover (Figma 85-13249) ──────────
function TimePicker({ value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [pos,  setPos]  = useState({top:0,left:0});
  const trigRef = useRef(null);
  const popRef  = useRef(null);
  const hrRef   = useRef(null);
  const mnRef   = useRef(null);

  const HOURS = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
  const MINS  = ['00','05','10','15','20','25','30','35','40','45','50','55'];
  const parts = value ? value.split(':') : [null,null];
  const curH = parts[0]||null;
  const curM = parts[1]||null;

  useEffect(()=>{
    const h = e => {
      if (open && trigRef.current && !trigRef.current.contains(e.target) && popRef.current && !popRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[open]);

  useEffect(()=>{
    if (!open) return;
    setTimeout(()=>{
      if (hrRef.current) { const s=hrRef.current.querySelector('.tp-sel'); if(s) s.scrollIntoView({block:'center',behavior:'instant'}); }
      if (mnRef.current) { const s=mnRef.current.querySelector('.tp-sel'); if(s) s.scrollIntoView({block:'center',behavior:'instant'}); }
    },0);
  },[open]);

  const openPop = () => {
    if (trigRef.current) {
      const r = trigRef.current.getBoundingClientRect();
      const left = Math.min(r.left, window.innerWidth - 140);
      setPos({ top: r.bottom+4, left: Math.max(8,left) });
    }
    setOpen(v=>!v);
  };

  return (
    <div ref={trigRef} className="tp-wrap">
      <div className={`tp-trigger ${open?'tp-open':''}`} onClick={openPop}>
        <span className={`tp-val ${!value?'tp-ph':''}`}>{value||(placeholder||'--:--')}</span>
      </div>
      {open && ReactDOM.createPortal(
        <div ref={popRef} className="tp-popover" style={{position:'fixed',top:pos.top,left:pos.left,zIndex:9999}}>
          <div className="tp-cols">
            <div className="tp-col" ref={hrRef}>
              {HOURS.map(h=>(
                <div key={h} className={`tp-cell ${h===curH?'tp-sel':''}`} onClick={()=>{ onChange(`${h}:${curM||'00'}`); }}>{h}</div>
              ))}
            </div>
            <div className="tp-divider"/>
            <div className="tp-col" ref={mnRef}>
              {MINS.map(m=>(
                <div key={m} className={`tp-cell ${m===curM?'tp-sel':''}`} onClick={()=>{ onChange(`${curH||'00'}:${m}`); }}>{m}</div>
              ))}
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

      <span className="t-arr">→</span>
      <TimePicker value={t.end} onChange={v=>onUpdate(t.id,'end',v)} placeholder="End"/>
      {canRemove && (
        <button className="t-rm" onClick={()=>onRemove(t.id)}>{I.closeXS}</button>
      )}
    </div>
  );
}

// ─── Date Picker Calendar (multi-select, portal when anchor provided) ──
function DatePickerCal({ selected, onSelect, onDone, anchor }) {
  const [pos,  setPos]  = useState({top:0,left:0});
  const [vm,   setVm]   = useState(() => {
    const d = selected.length>0 ? new Date(selected[0]+'T00:00:00') : new Date();
    return { y:d.getFullYear(), m:d.getMonth() };
  });
  const popRef = useRef(null);

  useEffect(()=>{
    if (anchor?.current) {
      const r = anchor.current.getBoundingClientRect();
      const left = Math.min(r.right-300, window.innerWidth-316);
      setPos({ top: r.bottom+4, left: Math.max(8,left) });
    }
  },[]);

  useEffect(()=>{
    if (!anchor) return;
    const h = e => {
      if (popRef.current && !popRef.current.contains(e.target) && (!anchor?.current||!anchor.current.contains(e.target))) { onDone&&onDone(); }
    };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);

  const today    = new Date();
  const todayKey = toDateKey(today.getFullYear(), today.getMonth(), today.getDate());
  const toggle   = (key,isSel) => onSelect(isSel ? selected.filter(d=>d!==key) : [...selected,key]);
  const prevM = () => setVm(v=>v.m===0?{y:v.y-1,m:11}:{y:v.y,m:v.m-1});
  const nextM = () => setVm(v=>v.m===11?{y:v.y+1,m:0}:{y:v.y,m:v.m+1});
  const prevY = () => setVm(v=>({...v,y:v.y-1}));
  const nextY = () => setVm(v=>({...v,y:v.y+1}));

  const content = (
    <div ref={popRef} className="dp-popover"
      style={anchor ? {position:'fixed',top:pos.top,left:pos.left,zIndex:9999} : {}}>
      <div className="dp-popover-hdr">
        <div className="dp-nav-group">
          <button className="dp-nav-btn" onClick={prevY}>«</button>
          <button className="dp-nav-btn" onClick={prevM}>‹</button>
        </div>
        <span className="dp-month-yr">{MONTH_NAMES[vm.m]} {vm.y}</span>
        <div className="dp-nav-group">
          <button className="dp-nav-btn" onClick={nextM}>›</button>
          <button className="dp-nav-btn" onClick={nextY}>»</button>
        </div>
      </div>
      <CalGrid year={vm.y} month={vm.m} selected={selected} onToggle={toggle}/>
      <div className="dp-footer">
        <button className="dp-today-btn" onClick={()=>toggle(todayKey,selected.includes(todayKey))}>Today</button>
        {onDone && <button className="dp-done-btn" onClick={onDone}>Done</button>}
      </div>
    </div>
  );
  return anchor ? ReactDOM.createPortal(content, document.body) : content;
}

// ─── Class Drawer (Create + Edit) ────────────────────────────────
function ClassDrawer({ open, onClose, onSave, mode='create', event=null, templates }) {
  const isEdit    = mode === 'editSingle' || mode === 'editRecurring';
  const isRecEdit = mode === 'editRecurring';
  // Look up template data for pre-population (use live templateData if provided, fall back to static)
  const tplMap = templates || CLASS_TEMPLATES;
  const tpl  = isEdit    ? (tplMap[event?.t]             || {}) : {};
  const schd = isRecEdit ? (CLASS_SCHEDULE_DATA[event?.t] || {}) : {};

  const [classType,  setClassType]  = useState('single'); // only used in create mode

  const [cls,        setCls]        = useState(isEdit ? event?.t||'' : '');
  const [trainer,    setTrainer]    = useState(isEdit ? tpl.trainer||event?.i||'' : '');
  const [isSub,      setIsSub]      = useState(isEdit ? !!(event?.isSub ?? tpl.isSub) : false);

  // Edit-only extra class details — pre-populated from CLASS_TEMPLATES
  const [classOnline,setClassOnline]= useState(isEdit ? tpl.classType||'Onsite' : 'Onsite');
  const [category,   setCategory]   = useState(isEdit ? tpl.category||'' : '');
  const [facility,   setFacility]   = useState(isEdit ? tpl.facility||event?.facility||'' : '');
  const [classSize,  setClassSize]  = useState(isEdit ? String(tpl.classSize||'') : '');
  const [level,      setLevel]      = useState(isEdit ? tpl.level||'All levels' : 'All levels');

  // Single scheduling — editSingle always shows date + time
  const evH = event?.h || 10;
  const [singleDate, setSingleDate] = useState(isEdit ? '2026-08-21' : '');
  const [singleStart,setSingleStart]= useState(isEdit ? `${String(evH).padStart(2,'0')}:00` : '');
  const [singleEnd,  setSingleEnd]  = useState(isEdit ? `${String(evH+1).padStart(2,'0')}:00` : '');

  // Recurring scheduling — pre-populated from CLASS_SCHEDULE_DATA
  const [startDate,  setStartDate]  = useState(isRecEdit ? schd.startDate||'2025-05-10' : '');
  const [endDate,    setEndDate]    = useState('');
  const [noEnd,      setNoEnd]      = useState(true);
  const [every,      setEvery]      = useState(isRecEdit ? schd.every||1 : 1);
  const [unit,       setUnit]       = useState(isRecEdit ? schd.unit||'Week(s)' : 'Week(s)');
  const [selDays,    setSelDays]    = useState(() => isRecEdit ? (schd.days||['Sun','Wed']) : []);
  const [daySlots,   setDaySlots]   = useState(() => {
    if (!isRecEdit) return {};
    const raw = schd.daySlots || {Sun:[{start:'09:00',end:'15:00'},{start:'15:00',end:'16:00'}],Wed:[{start:'09:00',end:'15:00'}]};
    const res = {};
    Object.entries(raw).forEach(([d,ts]) => { res[d] = ts.map(t => ({id:uid(),start:t.start,end:t.end})); });
    return res;
  });
  const [dayTimes,   setDayTimes]   = useState([mkTime()]);

  // Date specific (create mode only — no pre-population needed)
  const initDsEntries = () => [];
  const initDsDates   = () => [];

  const [dsEntries,  setDsEntries]  = useState(initDsEntries);
  const [dsSelDates, setDsSelDates] = useState(initDsDates());
  const [calOpen,    setCalOpen]    = useState(false);
  const addDaysBtnRef = useRef(null);

  // Confirm modal (recurring edit)
  const [showConfirm,setShowConfirm]= useState(false);
  const [applyTo,    setApplyTo]    = useState('future');
  const [isDirty,    setIsDirty]    = useState(false);

  if (!open) return null;

  const isWeek = unit === 'Week(s)';
  const orderedSelDays = DAY_BTNS.filter(d => selDays.includes(d));

  // ── Day toggling (recurring weekly)
  const toggleDay = d => {
    setIsDirty(true);
    if (selDays.includes(d)) {
      setSelDays(p=>p.filter(x=>x!==d));
      setDaySlots(p=>{const n={...p};delete n[d];return n;});
    } else {
      setSelDays(p=>[...p,d]);
      setDaySlots(p=>({...p,[d]:[mkTime()]}));
    }
  };
  const addDayTime  = d => { setIsDirty(true); setDaySlots(p=>({...p,[d]:[...p[d],mkTime()]})); };
  const rmDayTime   = (d,id) => setDaySlots(p=>({...p,[d]:p[d].length>1?p[d].filter(t=>t.id!==id):p[d]}));
  const updDayTime  = (d,id,f,v) => { setIsDirty(true); setDaySlots(p=>({...p,[d]:p[d].map(t=>t.id===id?{...t,[f]:v}:t)})); };
  const copyDaySlots = fromDay => {
    const base = daySlots[fromDay].map(t=>({id:uid(),start:t.start,end:t.end}));
    const n = {};
    selDays.forEach(d=>{ n[d] = d===fromDay ? daySlots[d] : base.map(t=>({...t,id:uid()})); });
    setDaySlots(n);
  };

  // ── Day(s) mode flat times
  const addDayTime2 = () => { setIsDirty(true); setDayTimes(p=>[...p,mkTime()]); };
  const rmDayTime2  = id  => setDayTimes(p=>p.length>1?p.filter(t=>t.id!==id):p);
  const updDayTime2 = (id,f,v) => { setIsDirty(true); setDayTimes(p=>p.map(t=>t.id===id?{...t,[f]:v}:t)); };

  // ── Date specific
  const handleDsSelect = dates => {
    const removed = dsSelDates.filter(d=>!dates.includes(d));
    const added   = dates.filter(d=>!dsSelDates.includes(d));
    let updated = dsEntries.filter(e=>!removed.includes(e.date));
    added.forEach(d => updated.push({id:uid(),date:d,times:[mkTime()]}));
    updated.sort((a,b)=>a.date.localeCompare(b.date));
    setDsEntries(updated);
    setDsSelDates(dates);
    setIsDirty(true);
  };
  const addDsTime = eid  => setDsEntries(p=>p.map(e=>e.id===eid?{...e,times:[...e.times,mkTime()]}:e));
  const rmDsTime  = (eid,tid) => setDsEntries(p=>p.map(e=>e.id===eid?{...e,times:e.times.length>1?e.times.filter(t=>t.id!==tid):e.times}:e));
  const updDsTime = (eid,tid,f,v) => { setIsDirty(true); setDsEntries(p=>p.map(e=>e.id===eid?{...e,times:e.times.map(t=>t.id===tid?{...t,[f]:v}:t)}:e)); };

  const handleSave = () => {
    if (isRecEdit) { setShowConfirm(true); return; }
    onClose(); onSave(cls||'New class');
  };
  const handleConfirm = () => { setShowConfirm(false); onClose(); onSave(cls||'New class'); };

  // Build change summary for confirm modal
  const changeSummary = [
    `Repeats every ${every} ${unit}`,
    isWeek && orderedSelDays.length>0 ? `Days: ${orderedSelDays.map(d=>DAY_FULL[d]).join(', ')}` : null,
    isWeek ? orderedSelDays.map(d=>{
      const ts = (daySlots[d]||[]).map(t=>`${t.start||'--'}–${t.end||'--'}`).join(', ');
      return `${DAY_FULL[d]}: ${ts}`;
    }).join(' | ') : `Times: ${dayTimes.map(t=>`${t.start||'--'}–${t.end||'--'}`).join(', ')}`,
  ].filter(Boolean);

  const headerLabel = isEdit ? 'Edit class' : 'Create class';
  const saveDisabled = isEdit && !isDirty;

  return (
    <>
      <div className="drawer-scrim" onClick={onClose}/>
      <div className="drawer">

        {/* Header */}
        <div className="drawer-hdr">
          <button className="dr-fab" onClick={onClose}>{I.close}</button>
          <div className="dr-title-wrap">
            <span className="dr-label">{headerLabel}</span>
            <span className="dr-classname">{cls || (isEdit ? 'Edit class' : 'New class')}</span>
          </div>
          <div className="dr-actions">
            {isEdit && (
              <button className="btn-delete" onClick={()=>{onClose();onSave(cls,'delete');}}>Delete</button>
            )}
            <button className="btn-cancel" onClick={onClose}>Cancel</button>
            <button className="btn-save" disabled={saveDisabled} onClick={handleSave}>Save</button>
          </div>
        </div>

        <div className="drawer-content">

          {/* ── Class details card ── */}
          <div className="card">
            <div className="card-title">Class details</div>

            {/* Schedule type tabs — create mode only */}
            {!isEdit && (
              <div className="sched-tabs">
                {[['single','Single class'],['recurring','Recurring schedule'],['dateSpecific','Date specific']].map(([t,l])=>(
                  <button key={t} className={`sched-tab ${classType===t?'active':''}`} onClick={()=>setClassType(t)}>{l}</button>
                ))}
              </div>
            )}

            {/* Class */}
            <div className="f-group">
              <label className="f-label">Class<span className="req">*</span></label>
              <Sel value={cls} onChange={v=>{setCls(v);setIsDirty(true);}} opts={CLASSES_LIST} placeholder="Select class"/>
            </div>

            {/* Trainer + inline substitute checkbox */}
            <div className="f-group" style={{marginBottom: isEdit ? 14 : 0}}>
              <label className="f-label">Trainer</label>
              <div className="trainer-row">
                <Sel value={trainer} onChange={v=>{setTrainer(v);setIsSub(false);setIsDirty(true);}} opts={TRAINERS_LIST} placeholder="Select trainer"/>
                {trainer && (
                  <div className="sub-inline" onClick={()=>{setIsSub(v=>!v);setIsDirty(true);}}>
                    <div className={`sub-chk-box ${isSub?'on':''}`}>{isSub && I.check}</div>
                    <span className="sub-chk-lbl">Mark trainer as substitute</span>
                  </div>
                )}
              </div>
            </div>

            {/* Edit-mode extra fields (class type disabled, categories, facility, trainers, size, level) */}
            {isEdit && (
              <>
                <div className="f-group">
                  <label className="f-label">Class type</label>
                  <div style={{display:'flex',gap:4,opacity:.5,pointerEvents:'none'}}>
                    {['Onsite','Online'].map(t=>(
                      <button key={t} style={{padding:'6px 14px',border:'1.5px solid var(--cape-dark)',borderRadius:'var(--r-sm)',fontSize:13,fontWeight:700,background:classOnline===t?'var(--cape-light)':'var(--pale-primary)',color:'var(--kit-primary)',fontFamily:'var(--font)'}}>{t}</button>

                  </div>

                <div className="f-group">
                  <label className="f-label">Categories</label>
                  <Sel value={category} onChange={setCategory} opts={CATEGORIES_LIST} placeholder="Select all that apply"/>

                <div className="f-group">

                  <Sel value={facility} onChange={v=>{setFacility(v);setIsDirty(true);}} opts={FACILITIES_LIST} placeholder="## FACILITY"/>

                <div className="f-group">

          {/* ── Class scheduling card ── */}

            {/* ── CREATE MODE: show tabs + content per classType ── */}

                  <Radio value="all"    selected={applyTo==='all'}    onChange={setApplyTo} label="All classes in this series"/>

function ClassDefinitionDrawer({ open, onClose, onSave, defFc, onGoToCalendar, classData }) {

  const [desc,        setDesc]        = useState(classData?.desc || '');

  const [facility,    setFacility]    = useState(tpl.facility || '');

// ─── Event Popup (Figma design) ───────────────────────────────────
function EventPopup({ popup, onClose, onViewClass, onEditClass, onEditRecurring, onDuplicate, fc, templates }) {
  const ref = useRef(null);
  useEffect(()=>{
    const h = e=>{ if(ref.current&&!ref.current.contains(e.target)) onClose(); };
    const t = setTimeout(()=>document.addEventListener('mousedown',h), 0);
    return ()=>{ clearTimeout(t); document.removeEventListener('mousedown',h); };
  },[onClose]);

  const {ev, x, y} = popup;
  const trainerDisplay = ev.isSub ? `${ev.i} (Sub)` : ev.i;
  const cap    = ev.capacity || 5;
  const maxCap = ev.maxCap   || 10;
  const fillPct = Math.min(100, Math.round((cap/maxCap)*100));

  return (
    <div ref={ref} className="ep-card" style={{left:x, top:y}}>
      {/* Header */}
      <div className="ep-card-hdr">
        <div className="ep-title-row">
          <div className="ep-dot" style={{background:(templates?.[ev.t]?.colour || ev.c)}}/>
          <span className="ep-class-name">{ev.t}</span>
        </div>
        <div className="ep-time">{ev.ti}</div>
        <div className="ep-meta">
          <div className="ep-meta-item">
            {I.person}
            <span>{trainerDisplay}</span>
          </div>
          {ev.recurring && (
            <div className="ep-recurr-tag">
              {I.recurr}
              <span>Recurring</span>
            </div>
          )}
        </div>
        <div className="ep-facility">
          {I.home}
          <span style={{marginLeft:6}}>{ev.facility||'Main Studio'}</span>
        </div>
      </div>

      {/* Capacity bar */}
      <div className="ep-capacity">
        <div className="ep-cap-row">
          <div className="ep-cap-track">
            <div className="ep-cap-fill" style={{width:`${fillPct}%`}}/>
          </div>
          <span className="ep-cap-lbl">{cap}/{maxCap}</span>
        </div>
      </div>

      <div className="ep-divider"/>

      {/* Actions */}
      <div className="ep-actions">
        <div className="ep-action" onClick={()=>{onViewClass(ev);onClose();}}>
          <span className="ep-action-ico pri">{I.list}</span>
          <span className="ep-action-lbl pri">View class</span>
        </div>
        <div className="ep-action" onClick={()=>{onEditClass(ev);onClose();}}>
          <span className="ep-action-ico">{I.edit}</span>
          <span className="ep-action-lbl">Edit class</span>
        </div>
        {ev.recurring && (
          <div className="ep-action" onClick={()=>{onEditRecurring(ev);onClose();}}>
            <span className="ep-action-ico">{I.calSrch}</span>
            <span className="ep-action-lbl">Edit recurring schedule</span>
          </div>
        )}
        {fc.showDuplicateClass && (
          <div className="ep-action" onClick={()=>{onDuplicate(ev);onClose();}}>
            <span className="ep-action-ico">{I.copy}</span>
            <span className="ep-action-lbl">Duplicate class</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Week View ────────────────────────────────────────────────────
function WeekView({ onSlotClick, fc, onEventClick, templates }) {
  const [slotMenu, setSlotMenu] = useState(null);

  const handleCell = (e, di, hv) => {
    if (EVENTS.some(ev=>ev.d===di&&ev.h===hv)) return;
    const r = e.currentTarget.getBoundingClientRect();
    let x=r.right+6, y=r.top;
    if(x+162>window.innerWidth) x=r.left-168;
    if(y+160>window.innerHeight) y=window.innerHeight-165;
    setSlotMenu({x,y});
  };
  const handleEvClick = (e, ev) => {
    if(!fc.showEventPopup) return;
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    let x=r.right+8, y=r.top;
    if(x+292>window.innerWidth) x=r.left-300;
    if(y+390>window.innerHeight) y=window.innerHeight-395;
    onEventClick({ev, x, y});
  };

  return (
    <div className="week-area">
      <div className="week-col-hdrs">
        <div className="week-col-spacer"/>
        {WEEK_DAYS.map((d,i)=>(
          <div key={i} className="week-col-hdr">
            <div className="week-day-name">{d}</div>
            <div className={`week-day-num ${i===TODAY_IDX?'today':''}`}>{WEEK_DATES[i]}</div>
          </div>
        ))}
      </div>
      <div className="week-scroll">
        <div className="week-grid">
          {HOURS.map((hr,hi)=>(
            <React.Fragment key={hi}>
              <div className="time-lbl">{hr.lbl}</div>
              {WEEK_DAYS.map((_,di)=>{
                const evs = EVENTS.filter(ev=>ev.d===di&&ev.h===hr.v);
                return (
                  <div key={di} className={`day-cell ${evs.length?'filled':''}`} onClick={e=>handleCell(e,di,hr.v)}>
                    {evs.map((ev,ei)=>(
                      <div key={ei} className={`ev ${fc.showEventPopup?'clickable':''}`}
                        style={{background:(templates?.[ev.t]?.colour || ev.c)}} onClick={e=>handleEvClick(e,ev)}>
                        <div className="ev-title">{ev.t}</div>
                        <div className="ev-time">{ev.ti}</div>
                        <div className="ev-bottom">
                          <div className="ev-inst">
                            {(templates?.[ev.t]?.trainer || ev.i)}{ev.isSub&&<span className="ev-sub">Sub</span>}
                          </div>
                          {ev.recurring&&<div className="ev-recurr-ico" title="Recurring">{I.recurr}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
      {slotMenu && (
        <SlotMenu x={slotMenu.x} y={slotMenu.y}
          onSelect={t=>{if(t==='Class')onSlotClick();setSlotMenu(null);}}
          onClose={()=>setSlotMenu(null)}/>
      )}
    </div>
  );
}

// ─── Context / Slot menus ─────────────────────────────────────────
function ContextMenu({ onSelect }) {
  return (
    <div className="ctx-menu">
      {[{l:'Class',ico:I.calNav},{l:'Appointment',ico:I.person},{l:'Course',ico:I.tasks},{l:'Event',ico:I.cal}].map((item,i)=>(
        <React.Fragment key={item.l}>
          {i===1&&<hr className="ctx-divider"/>}
          <button className="ctx-item" onClick={()=>onSelect(item.l)}>{item.ico} {item.l}</button>
        </React.Fragment>
      ))}
    </div>
  );
}
function SlotMenu({ x, y, onSelect, onClose }) {
  const ref = useRef(null);
  useEffect(()=>{
    const h = e=>{ if(ref.current&&!ref.current.contains(e.target)) onClose(); };
    const t = setTimeout(()=>document.addEventListener('mousedown',h), 0);
    return ()=>{ clearTimeout(t); document.removeEventListener('mousedown',h); };
  },[onClose]);
  return (
    <div ref={ref} className="slot-menu" style={{left:x,top:y}}>
      <div className="slot-menu-hdr">Create</div>
      {['Class','Appointment','Course'].map(l=>(
        <button key={l} className="ctx-item" onClick={()=>{onSelect(l);onClose();}}>
          {l==='Class'?I.calNav:l==='Appointment'?I.person:I.tasks} {l}
        </button>
      ))}
    </div>
  );
}

// ─── Manage ───────────────────────────────────────────────────────

function ManageLayout({ subView, onSubView, onCreateClass, onToast, onSelectClass }) {
  return (
    <div className="manage-layout">
      <div className="manage-nav">
        <div className="manage-nav-hdr">Manage</div>
        {MANAGE_NAV.map(item=>(
          <button key={item} className={`manage-nav-item ${subView===item?'active':''}`} onClick={()=>onSubView(item)}>{item}</button>
        ))}

        ? <ClassesListPage onCreateClass={onCreateClass} onToast={onToast} onSelectClass={onSelectClass}/>
        : (
          <div className="manage-placeholder">
            <div style={{fontSize:36,opacity:.2}}>📋</div>
            <div style={{fontSize:16,fontWeight:700}}>{subView}</div>
